<svg width="1024" height="1024" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1728" />
      <stop offset="1" stop-color="#0a1020" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93ddfd" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- app-icon rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)" />
  <rect x="3" y="3" width="506" height="506" rx="111.5" fill="none" stroke="#1e3050" stroke-width="4" />

  <g transform="translate(256 256)">
    <!-- crossing orbits (Electron nod) -->
    <g stroke="url(#ring)" stroke-width="12" fill="none" opacity="0.62">
      <ellipse rx="240" ry="99" transform="rotate(-32)" />
      <ellipse rx="240" ry="99" transform="rotate(32)" />
    </g>
    <!-- one 'electron' travelling the orbit -->
    <circle cx="172" cy="-2" r="16" fill="#e6f5ff" transform="rotate(-32)" />

    <!-- nucleus = a subtitle screen -->
    <circle r="135" fill="#0a1526" />
    <circle r="135" fill="none" stroke="#23395a" stroke-width="4" />
    <rect x="-90" y="-44" width="180" height="33" rx="16.5" fill="#93ddfd" />
    <rect x="-58" y="11" width="116" height="33" rx="16.5" fill="#39a7e6" />
  </g>
</svg>
